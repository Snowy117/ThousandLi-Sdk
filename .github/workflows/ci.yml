name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK (.NET and npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Frontend install
        run: npm ci

      - name: Frontend SDK package build
        run: npm run build --workspace @thousandli/sdk

      - name: Restore
        run: dotnet restore ThousandLi.Sdk.slnx

      - name: Format
        run: dotnet format ThousandLi.Sdk.slnx --severity info --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ThousandLi.Sdk.slnx --no-restore

      - name: Test
        run: dotnet test ThousandLi.Sdk.slnx --no-build

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.14
        with:
          solution: ThousandLi.Sdk.slnx
          tool-version: '2026.1.3'
          format: Xml
          output: inspectcode-report.xml
          sEverity: HINT
          build: false

      - name: Fail on InspectCode issues
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          count = sum(1 for _ in ET.parse('inspectcode-report.xml').iter('Issue'))
          print(f'InspectCode issues: {count}')
          sys.exit(1 if count else 0)
          "

      - name: Frontend type-check
        run: npm run type-check

      - name: Frontend test
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Frontend audit
        run: npm audit --audit-level=low
